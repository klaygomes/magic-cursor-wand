<!doctype html>
<html lang="en">
  <body>
    <!-- #region attributes -->
    <script
      src="https://cdn.jsdelivr.net/npm/magic-cursor-wand/dist/magic-cursor-wand.iife.js"
      data-wand-storage-key="my-site-wand"
      data-wand-cursor="glow"
    ></script>
    <!-- #endregion attributes -->

    <!-- #region global -->
    <script src="https://cdn.jsdelivr.net/npm/magic-cursor-wand/dist/magic-cursor-wand.iife.js"></script>
    <script>
      MagicCursorWand.createWand({
        providers: [MagicCursorWand.localStorageProvider({ key: 'my-site-wand' })],
      });
    </script>
    <!-- #endregion global -->
  </body>
</html>
