name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    name: Open the release pull request or publish to npm
    needs: check
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      actions: write
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          commit: 'chore: release'
          title: 'chore: release'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Tag, release and pin the published version
        if: steps.changesets.outputs.hasChangesets == false
        run: |
          version=$(node -p "require(./package.json).version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then exit 0; fi
          if ! npm view "magic-cursor-wand@$version" version > /dev/null 2>&1; then exit 0; fi
          node --experimental-strip-types scripts/release-notes.ts "$version" > release-notes.md
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file release-notes.md
          rm release-notes.md
          pnpm docs:integrity
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: pin the script tag examples to v$version"
          git push
          gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
